<!doctype html>

  <!-- Shown for any address that does not exist. Everything is inside this one file so it works from any path. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font: 17px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #3e4663; background: linear-gradient(172deg, #ebf4ff 50%, #e7faea 50%); }
    main { width: 100%; max-width: 440px; padding: 28px 24px; border-radius: 22px; background: #fff; box-shadow: 0 24px 48px -20px rgba(13, 19, 58, .32); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; color: inherit; text-decoration: none; }
    .brand svg { flex: none; width: 46px; height: 46px; }
    .brand span { display: block; font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #131950; line-height: 1.25; }
    .brand span[lang] { font-size: 13px; font-weight: 700; letter-spacing: 0; text-transform: none; color: #1442be; }
    h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.15; color: #0d133a; }
    p { margin: 0 0 20px; }
    .actions { display: grid; gap: 10px; }
    a.btn { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 10px 16px; border-radius: 12px; color: #fff; font-weight: 700; text-decoration: none; }
    a.btn:focus-visible, .brand:focus-visible { outline: 3px solid #0d133a; outline-offset: 3px; }
    .home { background: #0d133a; }
    .clinic { background: #165be2; }
    .pharma { background: #008030; }

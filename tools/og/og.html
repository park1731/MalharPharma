<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<title>Link preview card (1200 x 630)</title>
<!--
  Source for assets/img/og-image.jpg, the picture shown when the site link is
  shared on WhatsApp, Facebook and others. Open this file through a local web
  server, take a 1200 x 630 screenshot and save it over assets/img/og-image.jpg.
-->
<link rel="stylesheet" href="../../assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; padding: 0; background: #fff; }
  .card { position: relative; display: grid; grid-template-columns: 560px 640px; width: 1200px; height: 630px; }
  .board { display: flex; flex-direction: column; justify-content: center; padding: 0 44px 64px 56px; background: linear-gradient(to bottom right, var(--clinic-50) 50%, var(--pharma-50) 50%); }
  .lockup { display: flex; align-items: center; gap: 18px; margin-bottom: 40px; }
  .lockup svg { width: 84px; height: 84px; flex: none; }
  .kn { display: block; font-family: var(--font-kannada); font-weight: 700; font-size: 24px; line-height: 1.3; color: var(--clinic-deep); }
  .en { display: block; font-family: var(--font-display); font-weight: 800; font-size: 25px; line-height: 1.1; letter-spacing: .015em; text-transform: uppercase; color: var(--navy); white-space: nowrap; }
  h1 { font-size: 60px; line-height: 1.04; margin: 0; }
  .photo { position: relative; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 44%; }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 64px; padding: 0 56px; background: var(--red); color: #fff; font-size: 23px; font-weight: 600; }
  .strip strong { font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <div class="board">
    <div class="lockup">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30.6" fill="#fff" stroke="#e82729" stroke-width="1.75"/><path fill="#165be2" stroke="#165be2" stroke-width="3" stroke-linejoin="round" d="M24 11.5h16v9.11L20.61 40H11.5V24H24z"/><path fill="#07b03a" stroke="#07b03a" stroke-width="3" stroke-linejoin="round" d="M40 52.5H24v-9.11L43.39 24h9.11v16H40z"/></svg>
      <div><span class="kn" lang="kn">ಮಲ್ಹಾರ್ ಫಾರ್ಮ &amp; ಕ್ಲಿನಿಕ್</span><span class="en">Malhar Pharma &amp; Clinic</span></div>
    </div>
    <h1>Your family’s <span class="t-clinic">clinic</span> and <span class="t-pharma">pharmacy</span>.</h1>
  </div>
  <div class="photo"><img src="../../assets/img/shopfront-1440.webp" alt=""></div>
  <div class="strip"><span>Begur–Koppa Main Road, Koppa, Bengaluru 560105</span><strong>Open Mon–Sat · 8 AM – 10:30 PM</strong></div>
</div>
</body>
</html>
